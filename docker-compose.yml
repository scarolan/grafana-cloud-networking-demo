services:
  # =========================================================================
  # Grafana Alloy — Telemetry collector
  # Receives OTLP from application services and ships to Grafana Cloud
  # =========================================================================
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    # No host ports — Alloy is internal-only (avoids conflicts with other demos).
    # Other containers reach it as alloy:4317/4318/12345 on the Docker bridge network.
    # Tests use "docker exec" to reach Alloy's endpoints from inside the network.
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=generally-available
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/12345'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - demo

  # =========================================================================
  # Network Metrics Generator — Simulates routers, switches, load balancers
  # Exposes Prometheus metrics on :9090/metrics
  # =========================================================================
  network-generator:
    build: ./network-generator
    restart: unless-stopped
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9090/metrics')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      alloy:
        condition: service_healthy
    networks:
      - demo

  # =========================================================================
  # k6 load testing — runs inside the Docker network via profile
  # Usage: docker compose --profile load-test run --rm k6 run /scripts/load-test.js
  # =========================================================================
  k6:
    image: grafana/k6:0.55.0
    profiles: ["load-test"]
    volumes:
      - ./k6:/scripts
    networks:
      - demo

networks:
  demo:
    driver: bridge
